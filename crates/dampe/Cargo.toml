[package]
name = "dampe"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The published program: only its window, with no console, and errors in message boxes.
windowed = []
# Reading flutters from a video device, and everything for testing that. Without it, flutters can only
# be pressed by hand, and the program has no code for reading video at all.
video = [
    "dampe-core/video",
    "dep:linuxvideo",
    "dep:libc",
    "dep:windows-core",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_Media_DirectShow",
    "windows/Win32_Media_MediaFoundation",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Ole",
    "windows/Win32_System_Variant",
]

[dependencies]
dampe-core = { path = "../dampe-core" }
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "backend-winit-x11", "backend-winit-wayland", "renderer-software", "compat-1-2"] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Slint finds fonts with fontconfig. Loaded when the program runs instead of linked, so building
# for Linux from Windows doesn't need its development files.
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }
linuxvideo = { version = "0.3.5", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.62", optional = true }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
