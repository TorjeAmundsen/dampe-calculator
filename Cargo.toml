[workspace]
resolver = "3"
members = ["crates/dampe-core", "crates/dampe", "crates/dampe-web"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"

[profile.release]
lto = "thin"
debug = 1

# What gets published: smaller and without debug info. The C runtime is linked in by .cargo/config.toml.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true
