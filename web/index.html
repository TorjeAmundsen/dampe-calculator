<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480">
<title>Dampe Calculator</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --reached: #6cd688; --blob: #e0c040; --blinking: #ff7070; --secondary: #a8a8a8; --field: #2d2d2d;
    --frame: #555555; --bar: #3d9bff; --likely: #e0a040; --card: #272727; --faint: #6a6a6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #1f1f1f; color: white; font-family: "Segoe UI", system-ui, sans-serif; }
  /* The gap beside a 4:3 game on a 1920x1080 stream, at 4:3 itself */
  #app { width: 480px; height: 320px; padding: 10px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
  #status { height: 26px; line-height: 26px; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #latest-row { height: 18px; line-height: 18px; display: flex; gap: 12px; font-size: 13px; color: var(--secondary); }
  #latest { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #latest.warning { color: var(--likely); }
  #box { position: relative; flex: 1; min-height: 92px; background: var(--field); border: 1px solid var(--frame); }
  #box.pulse { background: #5a5a5a; }
  #box.press { background: var(--reached); color: black; }
  #box.press.likely { background: var(--likely); }
  #bar { position: absolute; left: 0; bottom: 0; height: 14px; width: 0; background: var(--bar); }
  #box.likely #bar { background: var(--likely); }
  #box.press #bar { background: white; }
  #countdown { position: absolute; left: 0; right: 0; top: 6px; bottom: 18px; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; }
  #countdown.idle { font-size: 14px; color: var(--secondary); }
  #likely-text { position: absolute; left: 0; right: 0; top: 2px; text-align: center; font-size: 12px; font-weight: 700; color: var(--likely); }
  #margin { position: absolute; right: 6px; top: 2px; font-size: 11px; color: var(--secondary); }
  #box.press #likely-text, #box.press #margin { color: black; }
  #area { height: 112px; overflow: hidden; }
  #help { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 8px; text-align: center; font-size: 12px; color: var(--secondary); }
  #help p { margin: 0; }
  #summary { height: 16px; line-height: 16px; margin-bottom: 2px; font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { position: relative; height: 29px; margin-bottom: 2px; padding: 0 8px; display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 4px; overflow: hidden; }
  .row .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(106,106,106,.55), rgba(106,106,106,.2)); }
  .row.proven .fill { background: linear-gradient(90deg, rgba(108,214,136,.55), rgba(108,214,136,.2)); }
  .row > span { position: relative; }
  .chance { width: 58px; font-size: 14px; font-weight: 700; }
  .tallies { flex: 1; display: flex; gap: 8px; font-size: 10px; color: var(--secondary); }
  .tallies b { font-size: 12px; margin-right: 3px; }
  .time { width: 64px; text-align: right; font-size: 12px; font-weight: 700; }
  #settings { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 6px; font-size: 13px; }
  .line { display: flex; align-items: center; gap: 8px; }
  #timing { flex: 1; font-size: 11px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #volume { flex: 1; }
  #lag { width: 70px; }
  #lag.bad { outline: 1px solid var(--blinking); }
  #buttons { height: 32px; display: flex; gap: 8px; }
  #start-over { flex: 1; }
  #open-settings { width: 90px; }
  button, select, input[type=number] { background: var(--field); color: white; border: 1px solid var(--frame); border-radius: 4px; font: inherit; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { background: #3a3a3a; }
  select { height: 28px; width: 110px; }
  input[type=number] { height: 24px; padding: 0 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="status"></div>
  <div id="latest-row"><span id="latest"></span><span id="recent"></span></div>
  <div id="box">
    <div id="bar"></div>
    <div id="countdown" class="idle">No countdown yet</div>
    <div id="likely-text"></div>
    <div id="margin"></div>
  </div>
  <div id="area">
    <div id="help">
      <p>Press 3 or 4 for how many blinks, as each flutter (burst of blinks) ends. Press either again within 1.3 s to flip a wrong count.</p>
      <p>Press A on Yes when the countdown reaches zero. Start over before each new talk.</p>
      <p>Keep this tab focused, or keys won't count.</p>
    </div>
    <div id="candidates" hidden>
      <div id="summary"></div>
      <div id="rows"></div>
    </div>
    <div id="settings" hidden>
      <div class="line">
        <select id="platform" aria-label="Platform"><option value="n64">N64</option><option value="vc">Wii VC</option></select>
        <span id="timing"></span>
        <button id="log">Log</button>
      </div>
      <label class="line">Lag <input id="lag" type="number" min="-500" max="2000" step="10"> ms after a flutter's end</label>
      <div class="line">
        <label class="line"><input id="sound" type="checkbox"> Sound</label>
        <input id="volume" type="range" min="0" max="100" aria-label="Volume">
      </div>
    </div>
  </div>
  <div id="buttons">
    <button id="start-over">Start over (F8)</button>
    <button id="open-settings">Settings</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
